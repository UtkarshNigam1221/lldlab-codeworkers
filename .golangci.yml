run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck       # Check for unchecked errors
    - gosimple       # Simplify code
    - govet          # Report suspicious constructs
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Go static analysis
    - unused         # Check for unused constants, variables, functions and types
    - gofmt          # Check formatting
    - goimports      # Check import formatting
    - misspell       # Find commonly misspelled words
    - gosec          # Security problems
    - revive         # Fast, configurable, extensible linter
    - typecheck      # Type checking
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused function parameters
    - goconst        # Find repeated strings that could be constants
    - gocyclo        # Check cyclomatic complexity
    - dupl           # Code clone detection
    - godot          # Check if comments end in a period
    - bodyclose      # Check HTTP response bodies are closed
    - noctx          # Find http requests without context.Context
    - copyloopvar    # Check for pointers to loop variables (replaces exportloopref)
    - gocritic       # Opinionated Go linter

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
  
  govet:
    enable:
      - shadow
  
  gocyclo:
    min-complexity: 15
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  misspell:
    locale: US
  
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: var-naming
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: true
  
  gosec:
    excludes:
      - G204  # Audit use of command execution (we need this for Docker)
      - G304  # File path provided as taint input (we control the paths)
      - G114  # HTTP server without timeouts (FX manages lifecycle)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - goconst
    - path: scripts/
      linters:
        - errcheck
        - gosec
        - gocyclo
        - dupl
        - noctx
    - linters:
        - staticcheck
      text: "SA1019:"  # Ignore deprecation warnings for now
  
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
